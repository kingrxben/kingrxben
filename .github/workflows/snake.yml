name: Generate Blue Snake

on:
  schedule:
    # Se actualiza automáticamente cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub Contributions Snake (Blue Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-blue.svg?palette=github-light&color_snake=#0284C7&color_dots=#E0F2FE,#7DD3FC,#38BDF8,#0284C7,#1E3A8A
            dist/github-snake-blue-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0B1D3A,#1E3A8A,#1D4ED8,#0EA5E9,#7DD3FC

      - name: Push Snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
