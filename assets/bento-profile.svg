      <text x="14" y="21" fill="#FEF08A" font-size="11" font-weight="700" class="mono">🐦 PAIR PROGRAMMER</text>
      <text x="14" y="39" fill="#E0F2FE" font-size="12" class="sans">Nugget · Chief Morale Officer</text>
