    <circle cx="20" cy="20" r="4" fill="#38BDF8"/>
    <text x="33" y="24" fill="#BAE6FD" font-size="12" font-weight="700" class="mono">whoami.ts</text>

    <text x="20" y="68" fill="#7DD3FC" font-size="12" class="mono">const rxben = {</text>
    <text x="32" y="92" fill="#93C5FD" font-size="12" class="mono">name:</text>
    <text x="74" y="92" fill="#E0F2FE" font-size="12" class="mono">"Rubén Macaya",</text>

    <text x="32" y="116" fill="#93C5FD" font-size="12" class="mono">mood:</text>
    <text x="74" y="116" fill="#FDE047" font-size="12" class="mono">"creativo &amp; feliz ✨",</text>

    <text x="32" y="140" fill="#93C5FD" font-size="12" class="mono">focus:</text>
    <text x="82" y="140" fill="#E0F2FE" font-size="12" class="mono">"Fullstack + IA",</text>

    <text x="32" y="164" fill="#93C5FD" font-size="12" class="mono">color:</text>
    <text x="82" y="164" fill="#38BDF8" font-size="12" class="mono">"#38BDF8 (azul 💙)",</text>

    <text x="32" y="188" fill="#93C5FD" font-size="12" class="mono">pet:</text>
    <text x="68" y="188" fill="#FDE047" font-size="12" class="mono">"Nugget (ninfa 🐦)"</text>

    <text x="20" y="212" fill="#7DD3FC" font-size="12" class="mono">};</text>
    <rect class="blink-cursor" x="40" y="201" width="7" height="13" rx="1" fill="#38BDF8"/>

    <text x="20" y="240" fill="#64748B" font-size="11" class="mono">// @kingrxben · shipping with AI</text>
