<svg width="860" height="290" viewBox="0 0 860 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="52%" stop-color="#0B2246"/>
      <stop offset="100%" stop-color="#0E336B"/>
    </linearGradient>

    <radialGradient id="glowBlue1" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue2" cx="0.82" cy="0.65" r="0.48">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0" y1="0" x2="860" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="nuggetBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8A29E"/>
      <stop offset="100%" stop-color="#6B6560"/>
    </linearGradient>

    <linearGradient id="nuggetHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <clipPath id="bannerClip">
      <rect x="2" y="2" width="856" height="286" rx="20"/>
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      .nugget-bob {
        animation: bob 3.4s ease-in-out infinite;
        transform-origin: 710px 175px;
      }
      .crest-sway {
        animation: sway 2.8s ease-in-out infinite;
        transform-origin: 710px 88px;
      }
      .eye-blink {
        animation: blink 4.6s infinite;
        transform-origin: 721px 111px;
      }
      .note-float-1 {
        animation: floatNote 3.2s ease-in-out infinite;
      }
      .note-float-2 {
        animation: floatNote 3.2s ease-in-out 1.4s infinite;
      }
      .pulse-dot {
        animation: pulse 2.2s ease-in-out infinite;
      }
      .packet-1 {
        stroke-dasharray: 10 190;
        animation: travel 4.5s linear infinite;
      }
      .packet-2 {
        stroke-dasharray: 8 170;
        animation: travel 5.6s linear 1.2s infinite;
      }
      .sparkle {
        animation: twinkle 3s ease-in-out infinite;
      }
      .sparkle-delay {
        animation: twinkle 3s ease-in-out 1.5s infinite;
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes floatNote {
        0% { transform: translate(0, 6px); opacity: 0; }
        30% { opacity: 0.95; }
        80% { opacity: 0.8; }
        100% { transform: translate(12px, -16px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes travel {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect x="0" y="0" width="860" height="290" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="860" height="290" fill="url(#glowBlue1)"/>
    <rect x="0" y="0" width="860" height="290" fill="url(#glowBlue2)"/>

    <!-- Subtle grid -->
    <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
      <line x1="0" y1="58" x2="860" y2="58"/>
      <line x1="0" y1="116" x2="860" y2="116"/>
      <line x1="0" y1="174" x2="860" y2="174"/>
      <line x1="0" y1="232" x2="860" y2="232"/>
      <line x1="143" y1="0" x2="143" y2="290"/>
      <line x1="286" y1="0" x2="286" y2="290"/>
      <line x1="429" y1="0" x2="429" y2="290"/>
      <line x1="572" y1="0" x2="572" y2="290"/>
      <line x1="715" y1="0" x2="715" y2="290"/>
    </g>

    <!-- Subtle network topology lines (nod to Redes / Packet Tracer) -->
    <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.4" fill="none">
      <path d="M 40 250 L 170 218 L 320 245 L 490 210 L 600 240"/>
      <path d="M 480 42 L 580 70 L 650 38"/>
    </g>
    <g stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path class="packet-1" d="M 40 250 L 170 218 L 320 245 L 490 210 L 600 240"/>
      <path class="packet-2" d="M 480 42 L 580 70 L 650 38"/>
    </g>
    <g fill="#38BDF8" fill-opacity="0.45">
      <circle cx="170" cy="218" r="3"/>
      <circle cx="320" cy="245" r="3"/>
      <circle cx="490" cy="210" r="3"/>
      <circle cx="580" cy="70" r="2.5"/>
    </g>

    <!-- Left Content -->
    <!-- Status pill -->
    <g transform="translate(46, 38)">
      <rect x="0" y="0" width="286" height="28" rx="14" fill="#0F294E" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
      <circle class="pulse-dot" cx="16" cy="14" r="4.5" fill="#38BDF8"/>
      <text x="29" y="18.5" fill="#BAE6FD" font-size="12" font-weight="600" class="mono">building: fullstack + AI ✨</text>
    </g>

    <!-- Main Heading -->
    <text x="46" y="114" fill="url(#titleGrad)" font-size="35" font-weight="800" letter-spacing="-0.8" class="sans">Hola, soy Rubén · Rxben 👋</text>

    <!-- Subtitle -->
    <text x="46" y="148" fill="#E0F2FE" font-size="16" font-weight="500" class="sans">
      Rubén Macaya · Fullstack con IA, creativo y fan del azul 💙
    </text>

    <!-- Bio tags -->
    <g transform="translate(46, 172)">
      <rect x="0" y="0" width="142" height="30" rx="8" fill="#112E5B" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="14" y="19.5" fill="#93C5FD" font-size="12" font-weight="600" class="mono">⚡ Next · TS · AI</text>

      <rect x="152" y="0" width="166" height="30" rx="8" fill="#112E5B" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="166" y="19.5" fill="#93C5FD" font-size="12" font-weight="600" class="mono">🌐 Ayudante Redes</text>

      <rect x="328" y="0" width="170" height="30" rx="8" fill="#112E5B" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="342" y="19.5" fill="#93C5FD" font-size="12" font-weight="600" class="mono">🐍 Python · Flask</text>
    </g>

    <!-- Bottom prompt line -->
    <text x="46" y="246" fill="#7DD3FC" fill-opacity="0.85" font-size="12.5" class="mono">
      &gt; co-piloted by Nugget 🐦 · most repos are private 🔒 · always shipping
    </text>

    <!-- Right side: Nugget the Cockatiel (Ninfa) perched on a glowing code card -->
    <!-- Glow halo behind Nugget -->
    <circle cx="712" cy="148" r="88" fill="#38BDF8" fill-opacity="0.09"/>
    <circle cx="712" cy="148" r="64" fill="#60A5FA" fill-opacity="0.08"/>

    <!-- Perch (mini terminal bar) -->
    <g transform="translate(618, 214)">
      <rect x="0" y="0" width="192" height="44" rx="12" fill="#081A35" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="3.5" fill="#38BDF8"/>
      <circle cx="28" cy="14" r="3.5" fill="#60A5FA"/>
      <circle cx="40" cy="14" r="3.5" fill="#93C5FD"/>
      <text x="14" y="34" fill="#BAE6FD" font-size="11.2" font-weight="600" class="mono">nugget@kingrxben ~ % ♪</text>
    </g>

    <!-- Nugget illustration (ninfa ancestral) -->
    <g class="nugget-bob">
      <!-- Tail feathers -->
      <path d="M 672 182 L 642 238 L 656 240 L 686 190 Z" fill="#44403C"/>
      <path d="M 680 186 L 655 244 L 666 244 L 693 192 Z" fill="#57534E"/>

      <!-- Body -->
      <ellipse cx="708" cy="164" rx="34" ry="44" transform="rotate(-12 708 164)" fill="url(#nuggetBody)"/>

      <!-- Wing with bold white ancestral cockatiel patch -->
      <path d="M 678 144 C 668 166, 676 196, 704 204 C 718 194, 720 162, 704 140 Z" fill="#57534E"/>
      <path d="M 682 150 C 677 167, 681 187, 696 194 C 704 185, 705 165, 695 148 Z" fill="#F8FAFC"/>

      <!-- Yellow Head -->
      <circle cx="716" cy="112" r="26" fill="url(#nuggetHead)"/>
      <!-- Neck blend -->
      <path d="M 696 128 C 704 140, 724 140, 736 126 C 734 114, 702 114, 696 128 Z" fill="#FEF08A"/>

      <!-- Iconic Cockatiel Crest (Copete ancestral) -->
      <g class="crest-sway">
        <path d="M 712 88 C 706 66, 720 52, 734 54 C 722 60, 718 74, 718 88 Z" fill="#D6D3D1"/>
        <path d="M 707 90 C 698 70, 706 56, 720 56 C 711 63, 711 76, 713 90 Z" fill="#FEF08A"/>
        <path d="M 717 88 C 716 72, 728 62, 740 66 C 728 69, 723 78, 722 89 Z" fill="#A8A29E"/>
      </g>

      <!-- Rosy orange cheek (mejilla de ninfa!) -->
      <circle cx="711" cy="120" r="8" fill="#FB923C" fill-opacity="0.92"/>
      <circle cx="711" cy="120" r="4.8" fill="#EA580C" fill-opacity="0.88"/>

      <!-- Eye -->
      <g class="eye-blink">
        <circle cx="723" cy="109" r="4.3" fill="#0F172A"/>
        <circle cx="724.5" cy="107.5" r="1.4" fill="#FFFFFF"/>
      </g>

      <!-- Cute dark grey ancestral beak -->
      <path d="M 738 112 C 748 112, 750 120, 742 124 C 738 123, 736 118, 738 112 Z" fill="#64748B"/>
      <path d="M 738 119 C 743 120, 744 123, 739 124 Z" fill="#334155"/>

      <!-- Tiny feet on the terminal bar -->
      <g stroke="#FDA4AF" stroke-width="2.6" stroke-linecap="round">
        <line x1="704" y1="205" x2="704" y2="215"/>
        <line x1="699" y1="215" x2="709" y2="215"/>
        <line x1="720" y1="205" x2="720" y2="215"/>
        <line x1="715" y1="215" x2="725" y2="215"/>
      </g>
    </g>

    <!-- Floating music notes & sparkles around Nugget -->
    <text x="756" y="96" fill="#7DD3FC" font-size="16" class="sans note-float-1">♪</text>
    <text x="774" y="76" fill="#38BDF8" font-size="14" class="sans note-float-2">✦</text>
    <text x="640" y="94" fill="#BAE6FD" font-size="13" class="sans sparkle">✦</text>
    <text x="790" y="156" fill="#7DD3FC" font-size="11" class="sans sparkle-delay">✦</text>
  </g>

  <!-- Crisp outer border -->
  <rect x="2" y="2" width="856" height="286" rx="20" stroke="url(#cardStroke)" stroke-width="1.5"/>
</svg>
