<svg width="880" height="214" viewBox="0 0 880 214" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPlate" x1="0" y1="0" x2="880" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14080A"/>
      <stop offset="48%" stop-color="#0B090B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="crimsonBar" x1="0" y1="0" x2="0" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect x="0.5" y="0.5" width="879" height="213" rx="6"/>
    </clipPath>
    <style>
      .display {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <g clip-path="url(#plateClip)">
    <!-- Background -->
    <rect x="0" y="0" width="880" height="214" fill="url(#bgPlate)"/>

    <!-- Bold crimson left stripe -->
    <rect x="0" y="0" width="5" height="214" fill="url(#crimsonBar)"/>

    <!-- Subtle editorial red accent block on right edge -->
    <rect x="744" y="0" width="136" height="44" fill="#1C0A0D"/>

    <!-- Architectural hairlines -->
    <line x1="5" y1="44" x2="880" y2="44" stroke="#27171A" stroke-width="1"/>
    <line x1="5" y1="168" x2="880" y2="168" stroke="#27171A" stroke-width="1"/>
    <line x1="744" y1="0" x2="744" y2="44" stroke="#3F151B" stroke-width="1"/>

    <!-- Top bar -->
    <rect x="28" y="11" width="136" height="22" rx="3" fill="#2A0B0E" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="41" cy="22" r="3" fill="#EF4444"/>
    <text x="51" y="25.5" fill="#FECACA" font-size="10.5" font-weight="600" letter-spacing="1.2" class="mono">00 / KINGRXBEN</text>

    <text x="812" y="25.5" text-anchor="middle" fill="#FCA5A5" font-size="10.5" font-weight="600" letter-spacing="1.2" class="mono">ANTOFAGASTA</text>

    <!-- Main Editorial Block -->
    <text x="28" y="100" fill="#F4F4F0" font-size="40" font-weight="700" letter-spacing="-1.2" class="display">Rubén Macaya</text>
    <text x="316" y="100" fill="#EF4444" font-size="40" font-weight="700" letter-spacing="-1" class="display">/ Rxben</text>

    <text x="28" y="131" fill="#E4E4E7" font-size="14.5" font-weight="500" class="display">
      Ingeniero en Computación e Informática (UCN). Fullstack, QA e IA aplicada.
    </text>
    <text x="28" y="152" fill="#A1A1AA" font-size="13" class="display">
      Desarrollo de software claro, mantenible y en producción.
    </text>

    <!-- Bottom bar -->
    <text x="28" y="195" fill="#D4D4D8" font-size="10.5" letter-spacing="1.2" class="mono">
      NEXT.JS <tspan fill="#EF4444">·</tspan> TYPESCRIPT <tspan fill="#EF4444">·</tspan> SUPABASE <tspan fill="#EF4444">·</tspan> ASTRO <tspan fill="#EF4444">·</tspan> PYTHON <tspan fill="#EF4444">·</tspan> QA
    </text>

    <!-- Status pill -->
    <rect x="708" y="180" width="146" height="22" rx="3" fill="#DC2626"/>
    <text x="781" y="194.5" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1.2" class="mono">DISPONIBLE · FREELANCE</text>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.5" y="0.5" width="879" height="213" rx="6" stroke="#3F151B" stroke-width="1"/>
</svg>
