<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .cursor {
        animation: blink 1.2s steps(2, start) infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer plate -->
  <rect x="0.5" y="0.5" width="879" height="239" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1"/>

  <!-- Subtle architectural hairlines -->
  <line x1="0" y1="42" x2="880" y2="42" stroke="#1F1F23" stroke-width="1"/>
  <line x1="0" y1="196" x2="880" y2="196" stroke="#1F1F23" stroke-width="1"/>
  <line x1="636" y1="0" x2="636" y2="240" stroke="#1F1F23" stroke-width="1"/>

  <!-- Top bar: Left -->
  <circle cx="28" cy="21" r="3.5" fill="#DC2626"/>
  <text x="41" y="25" fill="#F4F4F0" font-size="11" font-weight="600" letter-spacing="1.4" class="mono">00 / KINGRXBEN</text>
  <text x="164" y="25" fill="#71717A" font-size="11" letter-spacing="1.2" class="mono">· ANTOFAGASTA, CL</text>

  <!-- Top bar: Right -->
  <text x="656" y="25" fill="#71717A" font-size="10.5" letter-spacing="1.3" class="mono">NUGGET.ASC</text>
  <text x="748" y="25" fill="#52525B" font-size="10.5" letter-spacing="1.1" class="mono">· CO-PILOT</text>

  <!-- Main Editorial Block (Left) -->
  <text x="28" y="102" fill="#F4F4F0" font-size="38" font-weight="700" letter-spacing="-1.2" class="display">Rubén Macaya</text>
  <text x="304" y="102" fill="none" stroke="#DC2626" stroke-width="1.25" font-size="38" font-weight="700" letter-spacing="-1" class="display">/ Rxben</text>

  <text x="28" y="136" fill="#D4D4D8" font-size="14.5" font-weight="500" class="display">
    Ingeniero en Computación e Informática (UCN) · Fullstack, QA e IA aplicada.
  </text>

  <text x="28" y="162" fill="#71717A" font-size="13" class="display">
    Diseño y desarrollo software claro, mantenible y en producción — sin ruido innecesario.
  </text>

  <!-- Bottom bar: Left -->
  <text x="28" y="222" fill="#A1A1AA" font-size="10.5" letter-spacing="1.4" class="mono">
    NEXT.JS  ·  TYPESCRIPT  ·  SUPABASE  ·  ASTRO  ·  PYTHON  ·  QA
  </text>

  <!-- Bottom bar: Right -->
  <text x="656" y="222" fill="#71717A" font-size="10.5" letter-spacing="1.2" class="mono">STATUS:</text>
  <text x="716" y="222" fill="#F4F4F0" font-size="10.5" letter-spacing="1.2" class="mono">FREELANCE</text>
  <rect class="cursor" x="795" y="212" width="6" height="11" fill="#DC2626"/>

  <!-- Right Panel: Minimalist ASCII Nugget (matching red/black ASCII avatar) -->
  <g transform="translate(690, 62)" font-size="10.5" class="mono" xml:space="preserve">
    <text x="0" y="10" fill="#A1A1AA">        /|</text>
    <text x="0" y="22" fill="#D4D4D8">       / |</text>
    <text x="0" y="34" fill="#F4F4F0">     .===.</text>
    <text x="0" y="46" fill="#F4F4F0">    /  <tspan fill="#DC2626">@</tspan>  \_</text>
    <text x="0" y="58" fill="#E4E4E7">   |  <tspan fill="#DC2626">(O)</tspan>  _)</text>
    <text x="0" y="70" fill="#D4D4D8">    \     /</text>
    <text x="0" y="82" fill="#71717A">    /:::::\</text>
    <text x="0" y="94" fill="#71717A">   /::<tspan fill="#F4F4F0">###</tspan>::\</text>
    <text x="0" y="106" fill="#71717A">  /:::<tspan fill="#F4F4F0">###</tspan>:::\</text>
    <text x="0" y="118" fill="#52525B">  \::::::::/</text>
    <text x="0" y="130" fill="#52525B">   '---||-'</text>
  </g>
</svg>
