<svg width="880" height="204" viewBox="0 0 880 204" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .cursor {
        animation: blink 1.2s steps(2, start) infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer plate -->
  <rect x="0.5" y="0.5" width="879" height="203" rx="6" fill="#09090B" stroke="#27272A" stroke-width="1"/>

  <!-- Architectural hairlines -->
  <line x1="0" y1="40" x2="880" y2="40" stroke="#1F1F23" stroke-width="1"/>
  <line x1="0" y1="162" x2="880" y2="162" stroke="#1F1F23" stroke-width="1"/>

  <!-- Top bar -->
  <circle cx="28" cy="20" r="3.5" fill="#DC2626"/>
  <text x="41" y="24" fill="#F4F4F0" font-size="11" font-weight="600" letter-spacing="1.4" class="mono">00 / KINGRXBEN</text>
  <text x="852" y="24" text-anchor="end" fill="#71717A" font-size="11" letter-spacing="1.3" class="mono">ANTOFAGASTA, CL</text>

  <!-- Main Editorial Block -->
  <text x="28" y="94" fill="#F4F4F0" font-size="40" font-weight="700" letter-spacing="-1.2" class="display">Rubén Macaya</text>
  <text x="316" y="94" fill="none" stroke="#DC2626" stroke-width="1.25" font-size="40" font-weight="700" letter-spacing="-1" class="display">/ Rxben</text>

  <text x="28" y="126" fill="#D4D4D8" font-size="14.5" font-weight="500" class="display">
    Ingeniero en Computación e Informática (UCN). Fullstack, QA e IA aplicada.
  </text>
  <text x="28" y="148" fill="#71717A" font-size="13" class="display">
    Diseño y desarrollo software claro, mantenible y en producción.
  </text>

  <!-- Bottom bar -->
  <text x="28" y="187" fill="#A1A1AA" font-size="10.5" letter-spacing="1.4" class="mono">
    NEXT.JS  ·  TYPESCRIPT  ·  SUPABASE  ·  ASTRO  ·  PYTHON  ·  QA
  </text>
</svg>
