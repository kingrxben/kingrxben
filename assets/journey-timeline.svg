<svg width="860" height="215" viewBox="0 0 860 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="routeBg" x1="0" y1="0" x2="860" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#0B2246"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="60" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .packet-flow {
        stroke-dasharray: 18 140;
        animation: flow 3.6s linear infinite;
      }
      .node-pulse {
        animation: ping 2.4s ease-in-out infinite;
        transform-origin: 750px 88px;
      }
      @keyframes flow {
        from { stroke-dashoffset: 158; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes ping {
        0%, 100% { r: 10; opacity: 0.45; }
        50% { r: 16; opacity: 0.08; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="213" rx="18" fill="url(#routeBg)" stroke="#1E3A8A" stroke-width="1.3"/>

  <!-- Header bar -->
  <text x="26" y="34" fill="#38BDF8" font-size="13" font-weight="700" class="mono">$ traceroute kingrxben.dev</text>
  <text x="260" y="34" fill="#64748B" font-size="12" class="mono">— 4 hops · 0% packet loss</text>

  <!-- Base connecting line -->
  <line x1="108" y1="88" x2="750" y2="88" stroke="url(#lineGrad)" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
  <!-- Animated data packet traveling across hops -->
  <line class="packet-flow" x1="108" y1="88" x2="750" y2="88" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>

  <!-- HOP 1: Bootcamp BHP -->
  <g>
    <text x="108" y="66" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="700" class="mono">HOP 01</text>
    <circle cx="108" cy="88" r="9" fill="#0B2246" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="108" cy="88" r="3.5" fill="#7DD3FC"/>
    <text x="108" y="122" text-anchor="middle" fill="#F0F9FF" font-size="13.5" font-weight="700" class="sans">Bootcamp BHP</text>
    <text x="108" y="142" text-anchor="middle" fill="#93C5FD" font-size="11.5" class="sans">Coding Dojo Latam</text>
    <rect x="52" y="155" width="112" height="22" rx="6" fill="#102A52" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="108" y="170" text-anchor="middle" fill="#BAE6FD" font-size="10.5" class="mono">Python + Flask</text>
  </g>

  <!-- HOP 2: Ayudantía Redes -->
  <g>
    <text x="322" y="66" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="700" class="mono">HOP 02</text>
    <circle cx="322" cy="88" r="9" fill="#0B2246" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="322" cy="88" r="3.5" fill="#7DD3FC"/>
    <text x="322" y="122" text-anchor="middle" fill="#F0F9FF" font-size="13.5" font-weight="700" class="sans">Ayudante de Redes</text>
    <text x="322" y="142" text-anchor="middle" fill="#93C5FD" font-size="11.5" class="sans">Clases prácticas</text>
    <rect x="252" y="155" width="140" height="22" rx="6" fill="#102A52" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="322" y="170" text-anchor="middle" fill="#BAE6FD" font-size="10.5" class="mono">Cisco Packet Tracer</text>
  </g>

  <!-- HOP 3: Consultorías TI -->
  <g>
    <text x="536" y="66" text-anchor="middle" fill="#60A5FA" font-size="11" font-weight="700" class="mono">HOP 03</text>
    <circle cx="536" cy="88" r="9" fill="#0B2246" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="536" cy="88" r="3.5" fill="#7DD3FC"/>
    <text x="536" y="122" text-anchor="middle" fill="#F0F9FF" font-size="13.5" font-weight="700" class="sans">Consultorías TI</text>
    <text x="536" y="142" text-anchor="middle" fill="#93C5FD" font-size="11.5" class="sans">Prácticas &amp; Tesis</text>
    <rect x="456" y="155" width="160" height="22" rx="6" fill="#102A52" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="536" y="170" text-anchor="middle" fill="#BAE6FD" font-size="10.5" class="mono">Next · Supabase · PHP</text>
  </g>

  <!-- HOP 4: Now (Fullstack + AI) -->
  <g>
    <text x="750" y="66" text-anchor="middle" fill="#FDE047" font-size="11" font-weight="700" class="mono">NOW ●</text>
    <circle class="node-pulse" cx="750" cy="88" r="14" fill="#38BDF8"/>
    <circle cx="750" cy="88" r="9" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2.5"/>
    <text x="750" y="122" text-anchor="middle" fill="#F0F9FF" font-size="13.5" font-weight="700" class="sans">Fullstack + IA</text>
    <text x="750" y="142" text-anchor="middle" fill="#7DD3FC" font-size="11.5" class="sans">Creando el futuro ✨</text>
    <rect x="688" y="155" width="124" height="22" rx="6" fill="#143A6E" stroke="#7DD3FC" stroke-opacity="0.6"/>
    <text x="750" y="170" text-anchor="middle" fill="#F0F9FF" font-size="10.5" class="mono">TS · Next · AI</text>
  </g>
</svg>
