<svg width="860" height="100" viewBox="0 0 860 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2246"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0E336B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="860" height="100" rx="16"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .wave-a { animation: driftA 7s ease-in-out infinite; }
      .wave-b { animation: driftB 9s ease-in-out infinite; }
      @keyframes driftA {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-28px); }
      }
      @keyframes driftB {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(24px); }
      }
    </style>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="860" height="100" fill="#071326"/>
    <path class="wave-a" d="M -40 42 Q 120 12 280 42 T 600 42 T 920 42 L 920 110 L -40 110 Z" fill="url(#waveGrad1)" fill-opacity="0.55"/>
    <path class="wave-b" d="M -40 54 Q 150 28 340 54 T 700 54 T 940 54 L 940 110 L -40 110 Z" fill="url(#waveGrad2)" fill-opacity="0.88"/>
    <text x="430" y="76" text-anchor="middle" fill="#BAE6FD" font-size="12.5" font-weight="600" class="mono">
      hecho con creatividad, código azul 💙 y la supervisión de Nugget 🐦
    </text>
  </g>
</svg>
